<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ろ過シミュレータ（自然流下）</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dashboard">
        <div id="ui-container">
            <!-- タイトル＋ボタン -->
            <div class="panel-header">
                <div>
                    <h1>ろ過シミュレータ</h1>
                    <p>自然流下（重力ヘッド圧）による定圧ろ過の可視化</p>
                </div>
                <div class="header-controls">
                    <button id="btn-run">▶ 開始</button>
                    <button id="btn-reset">↺ リセット</button>
                </div>
            </div>

            <!-- 操作条件（液頭） -->
            <div class="param-section">
                <div class="section-title">🌊 操作条件（自然流下）</div>
                <div class="param-row">
                    <label>初期液面高さ H₀ <span class="unit">[cm]</span></label>
                    <input type="range" id="sl-H0" min="1" max="100" step="1" value="30">
                    <span class="val-disp" id="vd-H0">30</span>
                </div>
                <div class="param-row">
                    <label>ろ過面積 A <span class="unit">[cm²]</span></label>
                    <input type="range" id="sl-area" min="1" max="100" step="1" value="20">
                    <span class="val-disp" id="vd-area">20</span>
                </div>
            </div>

            <!-- 粒子物性 -->
            <div class="param-section">
                <div class="section-title">🧪 粒子物性</div>
                <div class="param-row">
                    <label>粒子密度 ρ_p <span class="unit">[kg/m³]</span></label>
                    <input type="range" id="sl-rho-p" min="500" max="5000" step="50" value="2650">
                    <span class="val-disp" id="vd-rho-p">2650</span>
                </div>
                <div class="param-row">
                    <label>粒子径 d_p <span class="unit">[μm]</span></label>
                    <input type="range" id="sl-dp" min="1" max="500" step="1" value="50">
                    <span class="val-disp" id="vd-dp">50</span>
                </div>
                <div class="param-row">
                    <label>固体体積分率 C_s <span class="unit">[vol%]</span></label>
                    <input type="range" id="sl-cs" min="0.1" max="20" step="0.1" value="2">
                    <span class="val-disp" id="vd-cs">2.0</span>
                </div>
            </div>

            <!-- ろ液物性 -->
            <div class="param-section">
                <div class="section-title">💧 ろ液物性</div>
                <div class="param-row">
                    <label>粘度 μ <span class="unit">[mPa·s]</span></label>
                    <input type="range" id="sl-mu" min="0.1" max="100" step="0.1" value="1.0">
                    <span class="val-disp" id="vd-mu">1.0</span>
                </div>
                <div class="param-row">
                    <label>液密度 ρ_f <span class="unit">[kg/m³]</span></label>
                    <input type="range" id="sl-rho-f" min="500" max="1500" step="10" value="1000">
                    <span class="val-disp" id="vd-rho-f">1000</span>
                </div>
            </div>

            <!-- ろ材物性 -->
            <div class="param-section">
                <div class="section-title">🔩 ろ材物性</div>
                <div class="param-row">
                    <label>ケーク比抵抗 α <span class="unit">[×10⁸ m/kg]</span></label>
                    <input type="range" id="sl-alpha" min="1" max="500" step="1" value="50">
                    <span class="val-disp" id="vd-alpha">50</span>
                </div>
                <div class="param-row">
                    <label>ろ材抵抗 R_m <span class="unit">[×10⁸ m⁻¹]</span></label>
                    <input type="range" id="sl-rm" min="0.1" max="100" step="0.1" value="5">
                    <span class="val-disp" id="vd-rm">5.0</span>
                </div>
            </div>

            <!-- 計算結果 -->
            <div class="result-section">
                <div class="section-title">📊 計算結果</div>
                <div class="result-grid">
                    <div class="result-item">
                        <span class="res-label">ろ液量 V</span>
                        <span class="res-val" id="res-V">0.000</span>
                        <span class="res-unit">L</span>
                    </div>
                    <div class="result-item">
                        <span class="res-label">ろ過速度 dV/dt</span>
                        <span class="res-val" id="res-dVdt">0.000</span>
                        <span class="res-unit">mL/s</span>
                    </div>
                    <div class="result-item">
                        <span class="res-label">液面高さ H(t)</span>
                        <span class="res-val" id="res-H">–</span>
                        <span class="res-unit">cm</span>
                    </div>
                    <div class="result-item">
                        <span class="res-label">ヘッド圧 ΔP</span>
                        <span class="res-val" id="res-dP">–</span>
                        <span class="res-unit">Pa</span>
                    </div>
                    <div class="result-item">
                        <span class="res-label">ケーク厚み L_c</span>
                        <span class="res-val" id="res-Lc">0.000</span>
                        <span class="res-unit">mm</span>
                    </div>
                    <div class="result-item">
                        <span class="res-label">経過時間 t</span>
                        <span class="res-val" id="res-t">0.0</span>
                        <span class="res-unit">s</span>
                    </div>
                </div>
                <!-- ろ過終了バナー -->
                <div id="finish-banner" style="display:none; margin-top:8px; padding:7px 10px; border-radius:8px; background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.4); color:#fbbf24; font-size:0.8rem; font-weight:600; text-align:center;">
                    ⚠ 液面が空になりろ過が終了しました
                </div>
            </div>

        </div>
    </div>

    <!-- 3D可視化キャンバス -->
    <div id="canvas-container"></div>

    <!-- Three.js r128 (他シミュレータと統一) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
