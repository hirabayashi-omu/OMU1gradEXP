<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浄水場の水処理シミュレータ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f1f5f9;
      --bg-panel: #ffffff;
      --border-plant: #1e293b;
      --water-intake: #38bdf8;
      --water-main: #60a5fa;
      --water-clean: #93c5fd;
      --text-dark: #0f172a;
      --text-gray: #475569;
      --accent-blue: #0284c7;
      --accent-cyan: #0ea5e9;
      --callout-border: #38bdf8;
      --callout-bg: #ffffff;
      --floc-blue: #2563eb;
      --floc-core: #1d4ed8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0f1d;
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      color: var(--text-dark);
      padding: 16px 24px 40px;
      min-height: 100vh;
    }

    .main-container {
      max-width: 1420px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 24px 32px 36px;
      border: 1px solid #cbd5e1;
    }

    /* 原画ヘッダー再現 */
    .orig-header {
      margin-bottom: 16px;
    }
    .orig-header h1 {
      font-size: 1.35rem;
      font-weight: 900;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .orig-header h1::before {
      content: "■";
      color: #0f172a;
      font-size: 1.1rem;
    }
    .orig-header p {
      font-size: 0.95rem;
      color: #334155;
      margin-top: 6px;
      line-height: 1.6;
      font-weight: 500;
      padding-left: 20px;
    }

    /* 原画キャンバスエリア */
    .plant-canvas-wrap {
      position: relative;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.02);
    }
    #mainPlantCanvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1350 / 480;
    }

    /* 4大吹き出し（Callouts）グリッド - 原画忠実配置 */
    .callouts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 14px;
    }

    .callout-box {
      background: #ffffff;
      border: 2px solid var(--callout-border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .callout-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: #0369a1;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .callout-canvas-frame {
      width: 100%;
      height: 140px;
      background: #ffffff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .callout-canvas-frame canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .callout-desc {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      line-height: 1.5;
      text-align: left;
      width: 100%;
    }

  </style>
</head>
<body>
  <div class="main-container">
    <!-- 原画タイトル・解説文 -->
    <header class="orig-header">
      <h1>浄水場の水処理例</h1>
      <p>
        水源の汚染が深刻になっている現在、浄水場では凝集剤を投入して、汚濁物質を凝集・沈殿させて取り除いています。
      </p>
    </header>

    <!-- 原画忠実 プラント断面メインCanvas (引き出し線付き) -->
    <div class="plant-canvas-wrap">
      <canvas id="mainPlantCanvas" width="1350" height="480"></canvas>
    </div>

    <!-- 4大吹き出し（分散・凝集・沈殿・ろ過）原画忠実カード -->
    <div class="callouts-grid">
      <!-- 1. 分散 -->
      <div class="callout-box" id="boxDispersion">
        <div class="callout-title">分散</div>
        <div class="callout-canvas-frame">
          <canvas id="calloutCanvas1" width="280" height="140"></canvas>
        </div>
        <div class="callout-desc">
          凝集剤を投入、かき混ぜて素早く分散させます。
        </div>
      </div>

      <!-- 2. 凝集 -->
      <div class="callout-box" id="boxAggregation">
        <div class="callout-title">凝集</div>
        <div class="callout-canvas-frame">
          <canvas id="calloutCanvas2" width="280" height="140"></canvas>
        </div>
        <div class="callout-desc">
          ゆっくりかき混ぜながら、凝集剤に汚濁物質を凝集させます。
        </div>
      </div>

      <!-- 3. 沈殿 -->
      <div class="callout-box" id="boxSedimentation">
        <div class="callout-title">沈殿</div>
        <div class="callout-canvas-frame">
          <canvas id="calloutCanvas3" width="280" height="140"></canvas>
        </div>
        <div class="callout-desc">
          成長したフロックが沈殿。
        </div>
      </div>

      <!-- 4. ろ過 -->
      <div class="callout-box" id="boxFiltration">
        <div class="callout-title">ろ過</div>
        <div class="callout-canvas-frame">
          <canvas id="calloutCanvas4" width="280" height="140"></canvas>
        </div>
        <div class="callout-desc">
          砂などの間を通して汚濁物質を除去します。
        </div>
      </div>
    </div>
  </div>

  <!-- シミュレータ スクリプト -->
  <script>
    class WaterTreatmentExactPlant {
      constructor() {
        this.canvas = document.getElementById('mainPlantCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.w = this.canvas.width;
        this.h = this.canvas.height;

        this.calloutCanvases = [
          document.getElementById('calloutCanvas1'),
          document.getElementById('calloutCanvas2'),
          document.getElementById('calloutCanvas3'),
          document.getElementById('calloutCanvas4')
        ];
        this.calloutCtxs = this.calloutCanvases.map(c => c.getContext('2d'));

        // Parameters
        this.params = {
          rawTurbidity: 30,
          pacPpm: 25,
          rapidRpm: 200,
          chlorine: 1.2,
          isBackwash: false,
          isDraining: false
        };

        this.isPaused = false;
        this.time = 0;
        this.rapidAngle = 0;
        this.pumpAngle = 0;

        // Flow and Particle System
        this.particles = [];
        this.maxParticles = 500;
        this.sludgeAmount = 25;
        this.clogAmount = 12;

        this.history = [];
        for (let i = 0; i < 40; i++) {
          this.history.push({ raw: 30, treated: 0.04 });
        }

        // Callout micro particles
        this.initMicroParticles();
        this.initPlantParticles();
      }

      initPlantParticles() {
        for (let i = 0; i < 280; i++) {
          this.spawnParticle(Math.random() * (this.w - 300) + 180);
        }
      }

      spawnParticle(overrideX = null) {
        const x = overrideX !== null ? overrideX : 185 + Math.random() * 50;
        let y = 150 + Math.random() * 140;
        
        let type = 'raw'; // raw, micro_floc, floc, settled, clean
        let size = 2.0 + Math.random() * 1.6;

        if (x > 330 && x < 420) {
          type = 'micro_floc';
          size = 3.2 + Math.random() * 1.0;
        } else if (x >= 420 && x < 720) {
          type = 'floc';
          size = 4.5 + Math.random() * 3.5;
        } else if (x >= 720 && x < 920) {
          type = 'floc';
          size = 5.5 + Math.random() * 4.0;
        } else if (x >= 920) {
          type = 'clean';
          size = 1.2;
        }

        this.particles.push({
          x, y,
          vx: 0.7 + Math.random() * 0.4,
          vy: (Math.random() - 0.5) * 0.3,
          speedMul: 0.85 + Math.random() * 0.35,
          offsetX: (Math.random() - 0.5) * 18,
          offsetY: (Math.random() - 0.5) * 16,
          turnBottom: 272 + Math.random() * 24, // 272 ~ 296
          turnTop: 144 + Math.random() * 18,    // 144 ~ 162
          filterX: 935 + Math.random() * 80,    // ろ過層上の流入X位置 (分散)
          type,
          size,
          trapped: false,
          settled: false
        });
      }

      initMicroParticles() {
        // Micro 1: 分散 (PAC微粒子と汚濁粒子)
        this.m1 = [];
        for (let i = 0; i < 28; i++) {
          this.m1.push({
            x: Math.random() * 280,
            y: Math.random() * 140,
            vx: (Math.random() - 0.5) * 4.0,
            vy: (Math.random() - 0.5) * 4.0,
            isPac: Math.random() > 0.4,
            r: Math.random() > 0.4 ? 2.5 : 5.0
          });
        }

        // Micro 2: 凝集 (フロック結合・成長サイクル)
        this.m2Particles = [];
        this.m2LeftFloc = { x: 95, y: 95, r: 18, angle: 0, pulse: 1 };
        this.m2RightFloc = { x: 185, y: 90, r: 22, angle: 0, pulse: 1 };
        for (let i = 0; i < 6; i++) {
          this.spawnM2Particle();
        }

        // Micro 3: 沈殿 (連続沈降フロック群)
        this.m3Flocs = [];
        for (let i = 0; i < 8; i++) {
          this.m3Flocs.push({
            x: 35 + Math.random() * 210,
            y: Math.random() * 95,
            vy: 0.6 + Math.random() * 0.8,
            r: 10 + Math.random() * 5,
            settled: false
          });
        }

        // Micro 4: ろ過 (水分子通過 + フロック捕捉)
        this.m4Waters = [];
        for (let i = 0; i < 18; i++) {
          this.m4Waters.push({
            x: 40 + Math.random() * 200,
            y: Math.random() * 130,
            vy: 1.2 + Math.random() * 0.8
          });
        }
        this.m4Flocs = [];
        for (let i = 0; i < 4; i++) {
          this.spawnM4Floc();
        }
      }

      spawnM2Particle() {
        this.m2Particles.push({
          x: 110 + Math.random() * 60,
          y: -10 - Math.random() * 30,
          target: Math.random() > 0.5 ? 'left' : 'right',
          progress: 0,
          speed: 0.012 + Math.random() * 0.008
        });
      }

      spawnM4Floc() {
        this.m4Flocs.push({
          x: 70 + Math.random() * 140,
          y: -15,
          vy: 0.9 + Math.random() * 0.4,
          r: 12 + Math.random() * 4,
          trapped: false,
          trapY: 28 + Math.random() * 35
        });
      }

      update() {
        if (this.isPaused) return;

        this.time += 0.03;
        this.rapidAngle += (this.params.rapidRpm / 60) * 0.4;
        this.pumpAngle += 0.2;

        // Chemistry & Efficiencies
        const optimalPac = this.params.rawTurbidity * 0.8;
        const pacRatio = this.params.pacPpm / (optimalPac || 1);
        let flocQuality = 0;
        if (pacRatio <= 1.2) {
          flocQuality = Math.min(1.0, pacRatio);
        } else {
          flocQuality = Math.max(0.2, 1.0 - (pacRatio - 1.2) * 0.4);
        }
        if (this.params.pacPpm === 0) flocQuality = 0.05;

        const avgFlocSize = (0.3 + flocQuality * 2.5).toFixed(1);
        const treatedTurb = Math.max(0.01, (this.params.rawTurbidity * (1.0 - flocQuality * 0.95) * (this.params.isBackwash ? 0.4 : 0.03))).toFixed(2);

        // Update Sludge & Clog
        if (this.params.isDraining) {
          this.sludgeAmount = Math.max(5, this.sludgeAmount - 0.4);
        } else {
          this.sludgeAmount = Math.min(95, this.sludgeAmount + 0.015);
        }

        if (this.params.isBackwash) {
          this.clogAmount = Math.max(2, this.clogAmount - 0.5);
        } else {
          this.clogAmount = Math.min(90, this.clogAmount + 0.008);
        }

        // 流動中のアクティブ粒子数をカウント
        let activeCount = 0;
        for (let i = 0; i < this.particles.length; i++) {
          if (!this.particles[i].settled && !this.particles[i].trapped) {
            activeCount++;
          }
        }

        // Particle dynamics in plant (常に着水井から新しい原水粒子が絶え間なく湧き出す)
        if (activeCount < 160) {
          this.spawnParticle();
          if (activeCount < 100) this.spawnParticle();
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];

          // 沈殿フロックの代謝 (底面の定常平衡: 古い沈殿物はスラッジとして吸収消滅)
          if (p.settled) {
            p.settleTimer = (p.settleTimer || 0) + 1;
            if (this.params.isDraining) {
              p.y += 1.5; // 排泥バルブへ吸い込まれる
              if (p.y > 330) {
                this.particles.splice(i, 1);
                continue;
              }
            } else if (p.settleTimer > 350) {
              this.particles.splice(i, 1);
              continue;
            }
          }

          // ろ過層捕捉フロックの代謝 (砂層内での定常平衡: 閉塞に寄与し適度に消滅)
          if (p.trapped) {
            p.trapTimer = (p.trapTimer || 0) + 1;
            if (this.params.isBackwash) {
              p.vy = -2.5; // 逆洗で上へ吹き飛ぶ
              p.trapped = false;
            } else if (p.trapTimer > 300) {
              this.particles.splice(i, 1);
              continue;
            }
          }

          // 1. 着水井 (x: 180 ~ 290)
          if (p.x < 290) {
            p.vx = 0.75 * p.speedMul;
            if (p.x > 255) {
              // 仕切り壁 (x=290, y: 140~308) の上端 (y <= 145) を越えて急速かく拌池へ越流
              if (p.y > p.turnTop) {
                p.vy = -1.1 * p.speedMul;
              } else {
                p.vy = (Math.random() - 0.5) * 0.1;
              }
            } else {
              p.vy = Math.sin(this.time * 2 + p.x * 0.1) * 0.2 + (Math.random() - 0.5) * 0.1;
            }
          }
          // 2. 急速かく拌池 (x: 290 ~ 420): プロペラを中心とした左右の旋回渦流 (水平サイクロンミキシング)
          else if (p.x >= 290 && p.x < 420) {
            const mx = 360; // 撹拌機のX中心
            const my = 205; // 撹拌機のY中心
            const dx = p.x - mx;
            const dy = p.y - my;
            const dist = Math.sqrt(dx * dx + dy * dy) + 8;

            // 回転速度 (RPM連動)
            const rotSpeed = (this.params.rapidRpm / 60) * 1.8;

            // 左右の旋回成分 (水平方向の渦を強調)
            const tangentX = (-dy / dist) * rotSpeed * 1.6;
            const tangentY = (dx / dist) * rotSpeed * 0.5;

            // 中心への緩やかな引き込み ＆ 下流への全体推進流
            p.vx = 0.55 * p.speedMul + tangentX + (Math.random() - 0.5) * 0.15;
            p.vy = tangentY * 0.6 + (Math.random() - 0.5) * 0.1;

            // 撹拌時も水面より上や底壁より下にはみ出さない
            if (p.y < 144) { p.y = 144; p.vy = Math.abs(p.vy); }
            if (p.y > 296) { p.y = 296; p.vy = -Math.abs(p.vy); }

            if (flocQuality > 0.3) {
              p.type = 'micro_floc';
              p.size = 3.2 + Math.random() * 0.6;
            }
          }
          // 3. フロック形成池 (x: 420 ~ 740): 直角・U字型バッフル迂回流 (空間分散・面流動)
          else if (p.x >= 420 && p.x < 740) {
            const spd = p.speedMul;
            // 区画ごとの流向制御 (個体ごとの turnBottom / turnTop で分散)
            if (p.x < 440) {
              if (p.y < p.turnBottom) {
                p.vx = 0.12 * spd;
                p.vy = 1.25 * spd;
              } else {
                p.vx = 1.15 * spd;
                p.vy = (Math.random() - 0.5) * 0.08;
              }
            } else if (p.x >= 440 && p.x < 495) {
              if (p.y > p.turnTop) {
                p.vx = 0.12 * spd;
                p.vy = -1.25 * spd;
              } else {
                p.vx = 1.15 * spd;
                p.vy = (Math.random() - 0.5) * 0.08;
              }
            } else if (p.x >= 495 && p.x < 550) {
              if (p.y < p.turnBottom) {
                p.vx = 0.12 * spd;
                p.vy = 1.25 * spd;
              } else {
                p.vx = 1.15 * spd;
                p.vy = (Math.random() - 0.5) * 0.08;
              }
            } else if (p.x >= 550 && p.x < 605) {
              if (p.y > p.turnTop) {
                p.vx = 0.12 * spd;
                p.vy = -1.25 * spd;
              } else {
                p.vx = 1.15 * spd;
                p.vy = (Math.random() - 0.5) * 0.08;
              }
            } else if (p.x >= 605 && p.x < 660) {
              if (p.y < p.turnBottom) {
                p.vx = 0.12 * spd;
                p.vy = 1.25 * spd;
              } else {
                p.vx = 1.15 * spd;
                p.vy = (Math.random() - 0.5) * 0.08;
              }
            } else {
              if (p.y > 165 + p.offsetY) {
                p.vx = 0.45 * spd;
                p.vy = -1.05 * spd;
              } else {
                p.vx = 0.85 * spd;
                p.vy = (Math.random() - 0.5) * 0.08;
              }
            }

            if (p.type === 'micro_floc' && flocQuality > 0.4) {
              p.type = 'floc';
              p.size = Math.min(8.5, p.size + 0.03);
            }
          }
          // 4. 薬品沈殿池 (x: 740 ~ 890): 全断面への空間分散沈降
          else if (p.x >= 740 && p.x < 890) {
            const spd = p.speedMul;
            // 沈殿したフロックは壁の手前（x <= 845）で完全に停止
            if (p.type === 'floc' && p.size > 3.5 && !p.settled) {
              p.vy += 0.06 * (p.size / 5.0) * spd;
              if (p.y >= p.turnBottom) {
                p.y = p.turnBottom;
                p.vx = 0;
                p.vy = 0;
                p.settled = true;
              }
            } else if (!p.settled) {
              p.vy = (Math.random() - 0.5) * 0.12;
            }

            if (p.settled) {
              if (p.x > 845) p.x = 845;
              p.vx = 0;
            } else {
              // 上澄み水・微小フロックの流路 (空間分散S字クランク流)
              if (p.x < 850) {
                if (p.x > 815) {
                  // 壁1 (x=860) の下端へ下降潜り込み
                  if (p.y < p.turnBottom) {
                    p.vx = 0.25 * spd;
                    p.vy = 1.3 * spd;
                  } else {
                    p.vx = 1.0 * spd;
                    p.vy = 0;
                  }
                } else {
                  p.vx = 0.65 * spd;
                }
              } else if (p.x >= 850 && p.x < 885) {
                if (p.x < 865) {
                  p.vx = 1.0 * spd;
                  p.vy = 0;
                } else {
                  // 壁1と壁2の間で真上に上昇
                  if (p.y > p.turnTop) {
                    p.vx = 0.1 * spd;
                    p.vy = -1.4 * spd;
                  } else {
                    p.vx = 1.15 * spd;
                    p.vy = 0;
                  }
                }
              } else {
                if (p.y > 142) p.y = 140;
                p.vx = 1.0 * spd;
                p.vy = 0.1;
              }
            }
          }
          // 5. 急速ろ過池 (x: 890 ~ 1030): ろ過層全面 (filterX) への空間分散流入
          else if (p.x >= 890 && p.x < 1030) {
            const spd = p.speedMul;
            // ろ過層の上部水域 (y < 215)
            if (p.y < 215) {
              if (p.x < p.filterX) {
                p.vx = 0.9 * spd;
                p.vy = 0.25;
              } else {
                p.vx = 0.04;
                p.vy = 1.3 * spd;
              }
            } else {
              // 砂層内部 (y >= 215) を上から下へ垂直通過
              p.vx = 0.02;
              p.vy = 1.05 * spd;

              // 砂層で捕捉 (トラップ)
              if (p.y > 225 && p.y < 295 && p.type !== 'clean' && !p.trapped && Math.random() < 0.12) {
                p.trapped = true;
                p.vx = 0;
                p.vy = 0;
              }

              // 最下層（集水層 y > 300）を通過したら完全に清澄水へ
              if (p.y >= 300) {
                p.type = 'clean';
                p.size = 1.3;
                p.trapped = false;
                // 下部集水路を通って右へ抜ける
                p.vx = 0.9 * spd;
                p.vy = 0.05;
              }
            }
          }
          // 6. 浄水池への迂回流入 ＆ 浄水池内での送水ポンプ吸引 (x >= 1030)
          else if (p.x >= 1030) {
            const spd = p.speedMul;
            p.type = 'clean';

            if (!p.inPumpPipe) {
              // 6a. 仕切り壁1 (x=1050, y: 110~290) の下端をくぐる (y: 295~325)
              if (p.x < 1058) {
                if (p.y < 295) {
                  p.vy = 1.2 * spd;
                  p.vx = 0.3 * spd;
                } else {
                  p.vx = 0.85 * spd;
                  p.vy = 0.0;
                }
              }
              // 6b. 壁1と仕切り壁2 (x=1080, y: 150~320) の間で真上に垂直上昇
              else if (p.x >= 1058 && p.x < 1078) {
                if (p.y > 144) {
                  p.vx = 0.08 * spd;
                  p.vy = -1.4 * spd; // 上昇
                } else {
                  p.vx = 0.9 * spd; // 壁2の上端を乗り越える
                  p.vy = 0.0;
                }
              }
              // 6c. 浄水池内部 (x: 1078 ~ 1195, y: 140 ~ 310)
              else {
                // 壁2を乗り越えた後の水深への自然な展開
                if (p.x < 1115 && p.y < 170) {
                  p.vx = 0.75 * spd;
                  p.vy = 0.6 * spd;
                } else {
                  // 送水ポンプの吸込口 (x: 1158, y: 295) または吸込管へ向かって吸い寄せられる
                  const tx = 1158;
                  const ty = 280 + p.offsetY * 0.5;
                  const dx = tx - p.x;
                  const dy = ty - p.y;
                  const dist = Math.sqrt(dx * dx + dy * dy) + 1;

                  p.vx = (dx / dist) * 0.85 * spd;
                  p.vy = (dy / dist) * 0.75 * spd;

                  // 吸込管の先端（x: 1152~1164, y: 260~300）に吸い込まれたら管内上昇モードへ
                  if (p.x >= 1150 && p.x <= 1166 && p.y >= 260 && p.y <= 300) {
                    p.inPumpPipe = true;
                    p.x = 1158;
                  }
                }

                // 最右壁 (x = 1195) の突き抜け絶対防止
                if (p.x > 1192) {
                  p.x = 1192;
                  p.vx = -0.5;
                }
              }
            } else {
              // 6d. 送水ポンプ吸込管内を垂直上昇 → ポンプ P を通って送水
              p.x = 1158;
              p.vy = -2.2 * spd;
              p.vx = 0;

              // ポンプ P (y <= 110) を通過したら送水管へ送り出されて完了
              if (p.y <= 105) {
                this.particles.splice(i, 1);
                continue;
              }
            }
          }

          if (!p.trapped && !p.settled) {
            p.x += p.vx;
            p.y += p.vy;
          }

          // 水槽内の水域（水面と底壁）に完全収容する厳格なクランプ処理
          if (p.x >= 180 && p.x < 890) {
            if (p.y < 140) p.y = 140; // 水面より上にはみ出さない
            if (p.y > 300) p.y = 300; // 底壁より下にはみ出さない
          } else if (p.x >= 890 && p.x < 1030) {
            if (p.y < 140) p.y = 140;
            if (p.y > 330) p.y = 330;
          } else if (p.x >= 1030 && !p.inPumpPipe) {
            if (p.y < 138) p.y = 138;
            if (p.y > 315) p.y = 315;
            if (p.x > 1194) p.x = 1194;
          }

          if (p.x > 1205 || p.y < 90) {
            this.particles.splice(i, 1);
          }
        }

        // Micro View updates
        this.updateMicro();
      }

      updateMicro() {
        // --- 1. 分散 Micro ---
        this.m1.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 8 || p.x > 272) p.vx *= -1;
          if (p.y < 8 || p.y > 132) p.vy *= -1;
        });

        // --- 2. 凝集 Micro ---
        this.m2LeftFloc.angle += 0.02;
        this.m2RightFloc.angle -= 0.015;
        this.m2LeftFloc.pulse = 1 + Math.sin(this.time * 4) * 0.06;
        this.m2RightFloc.pulse = 1 + Math.cos(this.time * 4) * 0.06;

        for (let i = this.m2Particles.length - 1; i >= 0; i--) {
          const p = this.m2Particles[i];
          p.progress += p.speed;
          
          const startX = 140;
          const startY = 15;
          const targetObj = p.target === 'left' ? this.m2LeftFloc : this.m2RightFloc;
          
          p.x = startX + (targetObj.x - startX) * p.progress;
          p.y = startY + (targetObj.y - startY) * p.progress;

          if (p.progress >= 1.0) {
            // 合体完了
            if (p.target === 'left') {
              this.m2LeftFloc.r = Math.min(24, this.m2LeftFloc.r + 0.3);
            } else {
              this.m2RightFloc.r = Math.min(28, this.m2RightFloc.r + 0.3);
            }
            this.m2Particles.splice(i, 1);
            this.spawnM2Particle();
          }
        }

        if (this.m2LeftFloc.r > 23) this.m2LeftFloc.r = 16;
        if (this.m2RightFloc.r > 27) this.m2RightFloc.r = 19;

        // --- 3. 沈殿 Micro ---
        this.m3Flocs.forEach(f => {
          if (!f.settled) {
            f.y += f.vy;
            if (f.y >= 105) {
              f.y = 105 + (Math.random() * 8);
              f.settled = true;
            }
          }
        });

        // 定期的に沈殿池の底をリセット＆新規落下
        if (Math.random() < 0.05) {
          this.m3Flocs.push({
            x: 35 + Math.random() * 210,
            y: 5,
            vy: 0.7 + Math.random() * 0.7,
            r: 10 + Math.random() * 5,
            settled: false
          });
          if (this.m3Flocs.length > 14) {
            this.m3Flocs.shift();
          }
        }

        // --- 4. ろ過 Micro ---
        // 水分子の高速流下
        this.m4Waters.forEach(w => {
          w.y += w.vy;
          if (w.y > 140) {
            w.y = 5;
            w.x = 40 + Math.random() * 200;
          }
        });

        // フロックの砂層捕捉
        for (let i = this.m4Flocs.length - 1; i >= 0; i--) {
          const f = this.m4Flocs[i];
          if (!f.trapped) {
            f.y += f.vy;
            if (f.y >= f.trapY) {
              f.y = f.trapY;
              f.trapped = true;
            }
          }
        }

        // 捕捉されたフロックが溜まったらリフレッシュ
        if (this.m4Flocs.length < 5 && Math.random() < 0.04) {
          this.spawnM4Floc();
        }
        if (this.m4Flocs.length > 7) {
          this.m4Flocs.shift();
        }
      }

      draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.w, this.h);

        // 1. 原画風: 左側の美しい水源河川水流（三日月カーブ矢印 ＆ 取水ポンプ）
        this.drawIntakeStream();

        // 2. 原画風: 各池の断面構造 ＆ 水色グラデーション水域
        this.drawTanksAndWater();

        // 3. 原画風: 撹拌機プロペラ・上下バッフル板・多層ろ層・送水ポンプ
        this.drawMechanicsAndPipes();

        // 4. 水処理プロセス粒子（微粒子・PAC・フロック・清澄水）
        this.drawPlantParticles();

        // 5. 原画風: 薬品注入ノズル・注記テキスト
        this.drawAnnotationsAndChemicals();

        // 6. 原画風: 4大吹き出し（Callout）引き出し三角線
        this.drawCalloutTriangles();

        // 7. 4大ミクロキャンバスの描画
        this.drawMicroCanvases();
      }

      // --- 1. 水源・河川の水流描画 (下に凸の自然な河川ストリーム & 陸上の取水ポンプ P) ---
      drawIntakeStream() {
        const ctx = this.ctx;

        // 1. 水源ラベル
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 15px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('水源', 60, 350);

        // 矢印（水源 → 取水配管へ）
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(76, 350);
        ctx.lineTo(92, 350);
        ctx.lineTo(87, 346);
        ctx.moveTo(92, 350);
        ctx.lineTo(87, 354);
        ctx.stroke();

        // 2. 取水ポンプ配管（水源 → ポンプ P → 着水井底のラッパ管へ）
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(95, 350);
        ctx.lineTo(135, 350); // ポンプ P (x: 135) へ
        ctx.lineTo(135, 325); // 上へ立ち上がり
        ctx.lineTo(195, 325); // 着水井直下へ
        ctx.lineTo(195, 308); // ラッパ管へ
        ctx.stroke();

        // 取水ポンプ P (x: 135, y: 350)
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(135, 350, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 13px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('P', 135, 350);

        // 着水井の底部ラッパ口 (Funnel)
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(185, 308);
        ctx.lineTo(205, 308);
        ctx.lineTo(215, 290);
        ctx.lineTo(175, 290);
        ctx.closePath();
        ctx.fill();
      }

      // --- 2. 水槽構造 ＆ 水域描画 ---
      drawTanksAndWater() {
        const ctx = this.ctx;

        // 水槽内の水域グラデーション
        const waterGrad = ctx.createLinearGradient(180, 0, 1200, 0);
        waterGrad.addColorStop(0.0, 'rgba(56, 189, 248, 0.4)');
        waterGrad.addColorStop(0.3, 'rgba(96, 165, 250, 0.45)');
        waterGrad.addColorStop(0.7, 'rgba(147, 197, 253, 0.55)');
        waterGrad.addColorStop(1.0, 'rgba(191, 219, 254, 0.65)');

        ctx.fillStyle = waterGrad;
        ctx.beginPath();
        ctx.moveTo(180, 130);
        ctx.lineTo(1200, 130);
        ctx.lineTo(1200, 320);
        ctx.lineTo(1030, 320);
        ctx.lineTo(1030, 355);
        ctx.lineTo(920, 355);
        ctx.lineTo(920, 310);
        // 沈殿池 V字ホッパー (2箇所)
        ctx.lineTo(840, 310);
        ctx.lineTo(820, 330);
        ctx.lineTo(800, 310);
        ctx.lineTo(780, 330);
        ctx.lineTo(760, 310);
        ctx.lineTo(180, 310);
        ctx.closePath();
        ctx.fill();

        // 水面波線
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let x = 180; x <= 1200; x += 20) {
          const y = 130 + Math.sin(this.time * 3 + x * 0.05) * 1.5;
          if (x === 180) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 構造物外枠ライン（太い濃紺断面線）
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(180, 120);
        ctx.lineTo(180, 310);
        ctx.lineTo(760, 310);
        ctx.lineTo(780, 330);
        ctx.lineTo(800, 310);
        ctx.lineTo(820, 330);
        ctx.lineTo(840, 310);
        ctx.lineTo(920, 310);
        ctx.lineTo(920, 355);
        ctx.lineTo(1030, 355);
        ctx.lineTo(1030, 320);
        ctx.lineTo(1200, 320);
        ctx.lineTo(1200, 120);
        ctx.stroke();

        // ろ過層の多層構造
        const fx1 = 930;
        const fx2 = 1020;
        const fw = fx2 - fx1;

        // 1. 細かい砂/アンスラサイト (黄色)
        ctx.fillStyle = '#fde047';
        ctx.fillRect(fx1, 220, fw, 22);
        this.drawSandDots(fx1, 220, fw, 22, '#ca8a04', 2.0);

        // 2. 中粒砂 (オレンジ)
        ctx.fillStyle = '#fb923c';
        ctx.fillRect(fx1, 242, fw, 26);
        this.drawSandDots(fx1, 242, fw, 26, '#c2410c', 3.0);

        // 3. 砂利層 (茶色)
        ctx.fillStyle = '#b45309';
        ctx.fillRect(fx1, 268, fw, 30);
        this.drawGravelCircles(fx1, 268, fw, 30);

        // 4. 集水ブロック (縦ストライプ)
        ctx.fillStyle = '#334155';
        ctx.fillRect(fx1, 298, fw, 20);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1.5;
        for (let gx = fx1 + 4; gx < fx2 - 2; gx += 6) {
          ctx.beginPath();
          ctx.moveTo(gx, 298);
          ctx.lineTo(gx, 318);
          ctx.stroke();
        }
      }

      drawSandDots(x, y, w, h, col, r) {
        const ctx = this.ctx;
        ctx.fillStyle = col;
        for (let py = y + 3; py < y + h - 2; py += 5) {
          for (let px = x + 3; px < x + w - 2; px += 6) {
            ctx.beginPath();
            ctx.arc(px + (py % 2 * 3), py, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      drawGravelCircles(x, y, w, h) {
        const ctx = this.ctx;
        ctx.strokeStyle = '#78350f';
        ctx.fillStyle = '#d97706';
        ctx.lineWidth = 1;
        for (let py = y + 5; py < y + h - 4; py += 9) {
          for (let px = x + 5; px < x + w - 4; px += 10) {
            ctx.beginPath();
            ctx.arc(px + (py % 2 * 5), py, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }
        }
      }

      // --- 3. 機構・バッフル・配管描画 ---
      drawMechanicsAndPipes() {
        const ctx = this.ctx;
        ctx.fillStyle = '#0f172a';

        // 着水井・急速かく拌池の仕切り壁
        ctx.fillRect(290, 140, 5, 170);

        // 急速かく拌機
        const mx = 360;
        ctx.fillStyle = '#64748b';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(mx - 8, 80);
        ctx.lineTo(mx + 8, 80);
        ctx.lineTo(mx + 6, 95);
        ctx.lineTo(mx - 6, 95);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(mx, 95);
        ctx.lineTo(mx, 155);
        ctx.stroke();

        ctx.save();
        ctx.translate(mx, 155);
        const pScale = Math.abs(Math.sin(this.rapidAngle));
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.ellipse(0, 0, Math.max(2, 16 * pScale), 6, Math.PI / 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // フロック形成池 上下5本バッフル板
        ctx.fillRect(440, 120, 4, 150); // 上から
        ctx.fillRect(495, 160, 4, 150); // 下から
        ctx.fillRect(550, 120, 4, 150); // 上から
        ctx.fillRect(605, 160, 4, 150); // 下から
        ctx.fillRect(660, 120, 4, 150); // 上から

        // 沈殿池 点線区切り
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(760, 130);
        ctx.lineTo(760, 310);
        ctx.moveTo(800, 130);
        ctx.lineTo(800, 310);
        ctx.stroke();
        ctx.setLineDash([]);

        // ろ過池仕切り壁
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(860, 110, 5, 150);
        ctx.fillRect(890, 150, 5, 160);

        // 浄水池仕切り壁
        ctx.fillRect(1050, 110, 5, 200);
        ctx.fillRect(1080, 150, 5, 170);

        // 送水ポンプ P & クランク配管
        const px = 1170;
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(px - 14, 300);
        ctx.lineTo(px - 14, 120);
        ctx.lineTo(px - 5, 120);
        ctx.moveTo(px - 8, 300);
        ctx.lineTo(px - 8, 120);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(px, 110, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 14px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('P', px, 110);

        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px + 12, 105);
        ctx.lineTo(px + 30, 105);
        ctx.lineTo(px + 30, 30);
        ctx.lineTo(px + 60, 30);

        ctx.moveTo(px + 14, 115);
        ctx.lineTo(px + 38, 115);
        ctx.lineTo(px + 38, 40);
        ctx.lineTo(px + 60, 40);
        ctx.stroke();

        // 浄水ラベル ＆ 送水矢印
        ctx.fillStyle = '#0284c7';
        ctx.font = 'bold 15px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('浄水', px + 75, 35);

        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(px + 45, 35);
        ctx.lineTo(px + 68, 35);
        ctx.lineTo(px + 63, 31);
        ctx.moveTo(px + 68, 35);
        ctx.lineTo(px + 63, 39);
        ctx.stroke();
      }

      // --- 5. 引き出し三角線描画 ---
      drawCalloutTriangles() {

        ctx.beginPath();

        ctx.lineTo(510, 480);

        // 3. 沈殿
        ctx.beginPath();

      // --- 6. 粒子描画 ---
      drawPlantParticles() {
        const ctx = this.ctx;

        this.particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

          if (p.type === 'raw') {
            ctx.fillStyle = '#0284c7';
          } else if (p.type === 'micro_floc') {
            ctx.fillStyle = '#1d4ed8';
          } else if (p.type === 'floc') {
            ctx.fillStyle = '#2563eb';
          } else {
            ctx.fillStyle = '#38bdf8';
          }
          ctx.fill();
        });
      }

      // --- 7. 4大吹き出し（Callout）ミクロアニメーション ---
      drawMicroCanvases() {
        // 1. 分散
        const c1 = this.calloutCtxs[0];
        c1.clearRect(0, 0, 280, 140);
        c1.strokeStyle = 'rgba(14, 165, 233, 0.15)';
        c1.lineWidth = 2;
        c1.beginPath();
        c1.arc(140, 70, 50, this.time * 2, this.time * 2 + Math.PI * 1.5);
        c1.stroke();

        this.m1.forEach(p => {
          c1.beginPath();
          c1.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          c1.fillStyle = p.isPac ? '#38bdf8' : '#0284c7';
          c1.fill();
        });

        // 2. 凝集
        const c2 = this.calloutCtxs[1];
        c2.clearRect(0, 0, 280, 140);

        const arrowPulse = Math.sin(this.time * 5) * 4;
        c2.strokeStyle = '#0f172a';
        c2.lineWidth = 2.0;

        c2.beginPath();
        c2.moveTo(110 + arrowPulse, 32);
        c2.lineTo(130 + arrowPulse, 48);
        c2.lineTo(122 + arrowPulse, 48);
        c2.moveTo(130 + arrowPulse, 48);
        c2.lineTo(128 + arrowPulse, 40);
        c2.stroke();

        c2.beginPath();
        c2.moveTo(170 - arrowPulse, 32);
        c2.lineTo(150 - arrowPulse, 48);
        c2.lineTo(158 - arrowPulse, 48);
        c2.moveTo(150 - arrowPulse, 48);
        c2.lineTo(152 - arrowPulse, 40);
        c2.stroke();

        this.m2Particles.forEach(p => {
          c2.fillStyle = '#0284c7';
          c2.beginPath();
          c2.arc(p.x, p.y, 6.5, 0, Math.PI * 2);
          c2.fill();
        });

        this.drawFlocBlobAnimated(c2, this.m2LeftFloc.x, this.m2LeftFloc.y, this.m2LeftFloc.r * this.m2LeftFloc.pulse, this.m2LeftFloc.angle);
        this.drawFlocBlobAnimated(c2, this.m2RightFloc.x, this.m2RightFloc.y, this.m2RightFloc.r * this.m2RightFloc.pulse, this.m2RightFloc.angle);

        // 3. 沈殿
        const c3 = this.calloutCtxs[2];
        c3.clearRect(0, 0, 280, 140);

        const arrowBounceY = Math.sin(this.time * 4) * 5;
        c3.fillStyle = '#7dd3fc';
        c3.beginPath();
        c3.moveTo(130, 8 + arrowBounceY);
        c3.lineTo(150, 8 + arrowBounceY);
        c3.lineTo(150, 42 + arrowBounceY);
        c3.lineTo(162, 42 + arrowBounceY);
        c3.lineTo(140, 65 + arrowBounceY);
        c3.lineTo(118, 42 + arrowBounceY);
        c3.lineTo(130, 42 + arrowBounceY);
        c3.closePath();
        c3.fill();

        this.m3Flocs.forEach(f => {
          this.drawFlocBlob(c3, f.x, f.y, f.r);
        });

        // 4. ろ過
        const c4 = this.calloutCtxs[3];
        c4.clearRect(0, 0, 280, 140);

        c4.fillStyle = '#e2e8f0';
        c4.strokeStyle = '#94a3b8';
        c4.lineWidth = 1;

        for (let gy = 60; gy < 135; gy += 14) {
          for (let gx = 10; gx < 270; gx += 18) {
            c4.beginPath();
            c4.arc(gx + (gy % 2 * 9), gy, 7.5, 0, Math.PI * 2);
            c4.fillStyle = '#e2e8f0';
            c4.fill();
            c4.stroke();
          }
        }

        c4.strokeStyle = '#0f172a';
        c4.lineWidth = 2.5;
        c4.beginPath();
        c4.moveTo(90, 20);
        c4.lineTo(90, 130);
        c4.lineTo(84, 120);
        c4.moveTo(90, 130);
        c4.lineTo(96, 120);
        c4.stroke();

        c4.beginPath();
        c4.moveTo(190, 20);
        c4.lineTo(190, 130);
        c4.lineTo(184, 120);
        c4.moveTo(190, 130);
        c4.lineTo(196, 120);
        c4.stroke();

        this.m4Waters.forEach(w => {
          c4.fillStyle = '#38bdf8';
          c4.beginPath();
          c4.arc(w.x, w.y, 2.5, 0, Math.PI * 2);
          c4.fill();
        });

        this.m4Flocs.forEach(f => {
          this.drawFlocBlob(c4, f.x, f.y, f.r);
        });
      }

      drawFlocBlobAnimated(ctx, cx, cy, r, angle) {
        ctx.fillStyle = '#2563eb';
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = 1;

        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
          const curA = a + angle;
          const px = cx + Math.cos(curA) * (r * 0.65);
          const py = cy + Math.sin(curA) * (r * 0.65);
          ctx.beginPath();
          ctx.arc(px, py, r * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#1d4ed8';
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      drawFlocBlob(ctx, cx, cy, r) {
        ctx.fillStyle = '#2563eb';
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = 1;

        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
          const px = cx + Math.cos(a) * (r * 0.65);
          const py = cy + Math.sin(a) * (r * 0.65);
          ctx.beginPath();
          ctx.arc(px, py, r * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#1d4ed8';
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

    }

    // Initialize Simulation Loop
    window.addEventListener('DOMContentLoaded', () => {
      const plant = new WaterTreatmentExactPlant();

      function loop() {
        plant.update();
        plant.draw();
        requestAnimationFrame(loop);
      }

      loop();
    });
  </script>
</body>
</html>
