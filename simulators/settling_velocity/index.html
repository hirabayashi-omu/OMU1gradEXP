<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子の沈降速度</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dashboard">
        <div id="ui-container">
            <div class="panel">
                <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 12px; margin-bottom: 12px;">
                    <div>
                        <h1>粒子の沈降速度</h1>
                        <p>ストークス・アレン・ニュートンの式による終末速度計算</p>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                        <div class="controls" style="display: flex; gap: 8px; width: 100%;">
                            <button id="btn-drop" style="flex: 1;">粒子を落とす</button>
                            <button id="btn-reset" style="flex: 1;">リセット</button>
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 20px;">
                    
                    <!-- 流体設定 -->
                    <div style="flex: 1; min-width: 200px;">
                        <label for="fluid-preset" style="font-size: 0.95rem; font-weight: bold;">流体の種類</label>
                        <select id="fluid-preset" style="width: 100%; margin-top: 4px; padding: 6px; border-radius: 4px; border: 1px solid #475569; background: rgba(0,0,0,0.5); color: white;">
                            <option value="water">水</option>
                            <option value="glycerin">グリセリン</option>
                            <option value="air">空気</option>
                            <option value="custom">カスタム</option>
                        </select>
                        <div style="display: flex; gap: 8px; margin-top: 8px;">
                            <div style="flex: 1;">
                                <label for="fluid-density" style="font-size: 0.75rem;">密度 ρ<sub>f</sub> (kg/m³)</label>
                                <input type="number" id="fluid-density" value="1000" step="1" style="width: 100%; margin-top: 2px; padding: 4px; border-radius: 4px; border: 1px solid #475569; background: rgba(0,0,0,0.5); color: white;">
                            </div>
                            <div style="flex: 1;">
                                <label for="fluid-viscosity" style="font-size: 0.75rem;">粘度 μ (Pa·s)</label>
                                <input type="number" id="fluid-viscosity" value="0.001" step="0.0001" style="width: 100%; margin-top: 2px; padding: 4px; border-radius: 4px; border: 1px solid #475569; background: rgba(0,0,0,0.5); color: white;">
                            </div>
                        </div>
                    </div>

                    <!-- 粒子設定 -->
                    <div style="flex: 1; min-width: 200px;">
                        <label for="particle-density" style="font-size: 0.95rem; font-weight: bold;">粒子の材質</label>
                        <select id="particle-density" style="width: 100%; margin-top: 4px; padding: 6px; border-radius: 4px; border: 1px solid #475569; background: rgba(0,0,0,0.5); color: white;">
                            <option value="2650">砂 / ガラス (2650 kg/m³)</option>
                            <option value="1200">プラスチック (1200 kg/m³)</option>
                            <option value="7800">鉄 / 鋼 (7800 kg/m³)</option>
                            <option value="11340">鉛 (11340 kg/m³)</option>
                        </select>
                        <div style="margin-top: 8px;">
                            <label style="font-size: 0.85rem; font-weight: bold;"><span id="particle-size-label">平均粒子径 d_avg</span>: <span id="particle-size-val">0.0500</span> mm</label>
                            <input type="range" id="particle-size-slider" min="-4" max="-0.3" step="0.001" value="-1.301" style="width: 100%; margin-top: 4px; accent-color: #3b82f6;">
                            <div style="font-size: 0.7rem; color: #94a3b8; display: flex; justify-content: space-between;">
                                <span>0.0001 mm</span>
                                <span>0.5 mm</span>
                            </div>
                        </div>
                    </div>

                    <!-- 計算結果 -->
                    <div class="result-box" style="flex: 1.5; min-width: 300px; background: rgba(15, 23, 42, 0.8); padding: 12px; border-radius: 8px; border: 1px solid #334155; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <div>
                            <div style="font-size: 0.75rem; color: #94a3b8;">無次元粒子径 d*</div>
                            <div id="res-d-star" style="font-size: 1.1rem; font-weight: bold; color: #38bdf8;">0.00</div>
                        </div>
                        <div>
                            <div style="font-size: 0.75rem; color: #94a3b8;">沈降領域</div>
                            <div id="res-region" style="font-size: 1.1rem; font-weight: bold; color: #10b981;">-</div>
                        </div>
                        <div>
                            <div style="font-size: 0.75rem; color: #94a3b8;">終末速度 v<sub>t</sub></div>
                            <div id="res-velocity" style="font-size: 1.1rem; font-weight: bold; color: #fbbf24;">0.00 m/s</div>
                        </div>
                        <div>
                            <div style="font-size: 0.75rem; color: #94a3b8;">粒子レイノルズ数 Re<sub>p</sub></div>
                            <div id="res-rep" style="font-size: 1.1rem; font-weight: bold; color: #a78bfa;">0.00</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- MathJax for LaTeX Rendering -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Three.js and OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
