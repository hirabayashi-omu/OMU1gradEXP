<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作れる！コスメ＆日用品メイキング・ファクトリー | 科学の力で手作り体験</title>
  <meta name="description" content="シャンプー、保湿化粧水、ハンドクリーム、除菌ジェルなど、身近な日用品やコスメを自分で原料ブレンドして作れるシミュレーター。高校理科（化学・生物・物理）の原理を楽しく体験！">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="header-title-area">
      <h1>🧴 作れる！コスメ＆日用品メイキング・ファクトリー</h1>
      <div class="header-subtitle">原料を自由にブレンド！シャンプー・化粧水・ハンドクリーム・除菌ジェルを科学の力でつくろう</div>
    </div>
  </header>

  <!-- 操作＆製造メインエリア -->
  <div class="main-grid">
    
    <!-- 左カラム: 配合ラボ (Formulation Lab) -->
    <aside class="formulation-panel">
      <div class="panel-section-title">🧪 1. 作るアイテムと配合を決める</div>
      
      <!-- アイテム選択 -->
      <div class="input-group">
        <label for="selectProduct" class="input-label">作りたいアイテム:</label>
        <select id="selectProduct">
          <option value="shampoo" selected>🧴 泡立ちアロマシャンプー</option>
          <option value="lotion">💧 ぷるぷる高保湿アロマ化粧水</option>
          <option value="cream">🍦 なめらかうるおいハンドクリーム</option>
          <option value="handgel">🌿 ひんやり爽快・清潔ハンドジェル</option>
        </select>
      </div>

      <!-- オリジナル商品名 -->
      <div class="input-group">
        <label for="inputProductName" class="input-label">あなたのオリジナル商品名:</label>
        <input type="text" id="inputProductName" value="特製アロマシャンプー" maxlength="25">
      </div>

      <!-- 原料スライダーリスト -->
      <div class="input-group">
        <span class="input-label">原料のブレンド比率 (%):</span>
        <div class="materials-list" id="materialsContainer">
          <!-- JS動的生成 -->
        </div>
      </div>

      <!-- 製造条件 (温度・撹拌) -->
      <div class="panel-section-title">🌡️ 2. 作る条件（温度・混ぜる速さ）</div>
      
      <div class="input-group">
        <div class="param-row">
          <span>加熱温度:</span>
          <span id="valTemp" style="font-weight:bold; color:#f97316;">45℃</span>
        </div>
        <div class="param-slider-wrapper">
          <input type="range" id="inputTemp" min="20" max="85" value="45" step="1" style="flex:1; accent-color:#f97316;">
        </div>
      </div>

      <div class="input-group">
        <div class="param-row">
          <span>撹拌スピード:</span>
          <span id="valStir" style="font-weight:bold; color:#38bdf8;">320rpm</span>
        </div>
        <div class="param-slider-wrapper">
          <input type="range" id="inputStir" min="100" max="600" value="320" step="10" style="flex:1; accent-color:#38bdf8;">
        </div>
      </div>

      <!-- 科学ワンポイント解説 -->
      <div class="science-fact-card" id="scienceFactBox">
        <!-- JS動的生成 -->
      </div>
    </aside>

    <!-- 右カラム: リアルタイム製造ライン (Visual Area) -->
    <main class="visual-area">
      <!-- 上部アクションバー -->
      <div class="actions-bar">
        <div class="btn-group">
          <button id="btnStart" class="btn btn-make">✨ このレシピでつくる！</button>
          <button id="btnPause" class="btn btn-secondary" disabled>⏸ 一時停止</button>
          <button id="btnReset" class="btn btn-secondary">🔄 最初から作り直す</button>
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 0.8rem; color: #94a3b8;">つくるスピード:</span>
          <label style="font-size: 0.8rem; color: #cbd5e1; cursor: pointer;"><input type="radio" name="simSpeed" value="1.0" checked> 1x</label>
          <label style="font-size: 0.8rem; color: #cbd5e1; cursor: pointer;"><input type="radio" name="simSpeed" value="2.0"> 2x</label>
          <label style="font-size: 0.8rem; color: #cbd5e1; cursor: pointer;"><input type="radio" name="simSpeed" value="4.0"> 4x</label>
        </div>
      </div>

      <!-- キャンバス -->
      <div class="canvas-wrapper">
        <canvas id="processCanvas" width="1200" height="540" aria-label="コスメ製造リアルタイムライン"></canvas>
      </div>

      <!-- 5工程ステータスカード -->
      <div class="steps-progress-grid">
        <div class="step-card">
          <div class="step-card-header">① 原料の計量</div>
          <div class="step-card-stat" id="stat_s1">待機中</div>
          <div class="progress-bg"><div class="progress-fill" id="bar_s1"></div></div>
        </div>

        <div class="step-card">
          <div class="step-card-header">② 加熱・ブレンド</div>
          <div class="step-card-stat" id="stat_s2">待機中</div>
          <div class="progress-bg"><div class="progress-fill" id="bar_s2"></div></div>
        </div>

        <div class="step-card">
          <div class="step-card-header">③ なめらか仕上げ</div>
          <div class="step-card-stat" id="stat_s3">待機中</div>
          <div class="progress-bg"><div class="progress-fill" id="bar_s3"></div></div>
        </div>

        <div class="step-card">
          <div class="step-card-header">④ ボトル充填</div>
          <div class="step-card-stat" id="stat_s4">待機中</div>
          <div class="progress-bg"><div class="progress-fill" id="bar_s4"></div></div>
        </div>

        <div class="step-card">
          <div class="step-card-header">⑤ ラベル＆完成</div>
          <div class="step-card-stat" id="stat_s5">待機中</div>
          <div class="progress-bg"><div class="progress-fill" id="bar_s5"></div></div>
        </div>
      </div>
    </main>

  </div>

  <!-- 完成ポップアップカード (モーダル) -->
  <div id="resultModal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div id="resultModalBody">
        <!-- JS動的生成 -->
      </div>
      <div class="modal-footer">
        <button id="btnMakeAgain" class="btn btn-make">🔄 もう一度つくる！</button>
        <button id="btnCloseModal" class="btn btn-secondary">とじる</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/engine.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
